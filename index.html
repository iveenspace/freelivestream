<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Screen Share</title>
    <style>
        body { font-family: system-ui; text-align: center; background: #1a1a1a; color: white; padding: 2rem; }
        video { width: 80%; max-width: 800px; background: black; border-radius: 8px; border: 2px solid #333; }
    </style>
</head>
<body>
    <h1>Live Screen Share</h1>
    <button id="startButton">Start Sharing Screen</button>
    <video id="localVideo" autoplay playsinline muted></video>

    <!-- Load Socket.io client -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const startButton = document.getElementById('startButton');
        const localVideo = document.getElementById('localVideo');
        let pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });

        startButton.addEventListener('click', async () => {
            const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            localVideo.srcObject = stream;
            
            // Add tracks to PeerConnection
            stream.getTracks().forEach(track => pc.addTrack(track, stream));
            
            startButton.disabled = true;
            startButton.textContent = "Sharing...";
        });

        // Signaling logic
        pc.onicecandidate = e => e.candidate && socket.emit('signal', { candidate: e.candidate });
        socket.on('signal', async (data) => {
            if (data.candidate) await pc.addIceCandidate(data.candidate);
        });
    </script>
</body>
</html>
