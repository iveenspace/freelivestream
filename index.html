<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebRTC Streaming + Live Translation</title>

<style>
    body{
        font-family:system-ui,sans-serif;
        background:#121212;
        color:white;
        margin:0;
        padding:2rem;
        text-align:center;
    }

    .container{
        max-width:900px;
        margin:auto;
    }

    .video-container{
        position:relative;
        width:100%;
        background:black;
        border-radius:10px;
        overflow:hidden;
        margin-top:20px;
        border:2px solid #333;
    }

    video{
        width:100%;
        display:block;
    }

    .subtitles{
        position:absolute;
        bottom:20px;
        left:50%;
        transform:translateX(-50%);
        background:rgba(0,0,0,0.8);
        padding:10px 20px;
        border-radius:8px;
        max-width:80%;
        font-size:20px;
        font-weight:bold;
        display:none;
    }

    .controls{
        margin-top:20px;
        display:flex;
        justify-content:center;
        gap:10px;
        flex-wrap:wrap;
    }

    button{
        padding:12px 22px;
        border:none;
        border-radius:6px;
        font-size:16px;
        font-weight:bold;
        cursor:pointer;
    }

    .btn-streamer{
        background:#9146ff;
        color:white;
    }

    .btn-viewer{
        background:#00ea87;
        color:black;
    }

    .btn-control{
        background:#444;
        color:white;
    }

    .hidden{
        display:none;
    }
</style>
</head>

<body>

<div class="container">

    <h1>WebRTC Live Stream + Translation</h1>

    <div id="roleSelection">
        <p>Select your role</p>

        <button class="btn-streamer" onclick="joinAs('streamer')">
            I am the Streamer
        </button>

        <button class="btn-viewer" onclick="joinAs('viewer')">
            I am a Viewer
        </button>
    </div>

    <div id="videoInterface" class="hidden">

        <h2 id="statusMessage">Connecting...</h2>

        <div class="controls">
            <button id="startScreenShare" class="btn-streamer hidden">
                Start Screen Share
            </button>

            <button id="fullscreenBtn" class="btn-control hidden">
                Fullscreen
            </button>
        </div>

        <div class="video-container" id="videoWrapper">
            <video id="videoPlayer" autoplay playsinline></video>

            <div id="subtitlesBox" class="subtitles">
                Waiting for translation...
            </div>
        </div>

    </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

let peerConnection;
let localStream;
let recognition;
let userRole = "";

const rtcConfig = {
    iceServers: [
        {
            urls: "stun:stun.l.google.com:19302"
        }
    ]
};

const roleSelection = document.getElementById("roleSelection");
const videoInterface = document.getElementById("videoInterface");
const statusMessage = document.getElementById("statusMessage");
const startScreenShareBtn = document.getElementById("startScreenShare");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const videoPlayer = document.getElementById("videoPlayer");
const subtitlesBox = document.getElementById("subtitlesBox");
const videoWrapper = document.getElementById("videoWrapper");

function joinAs(role){

    userRole = role;

    roleSelection.classList.add("hidden");
    videoInterface.classList.remove("hidden");
    fullscreenBtn.classList.remove("hidden");

    statusMessage.textContent =
        `Joined as ${role.toUpperCase()}`;

    socket.emit("join", role);

    if(role === "streamer"){
        startScreenShareBtn.classList.remove("hidden");
    }
}

/* =========================
   FULLSCREEN
========================= */

fullscreenBtn.addEventListener("click", async () => {

    try{

        if(!document.fullscreenElement){
            await videoWrapper.requestFullscreen();
        }else{
            await document.exitFullscreen();
        }

    }catch(err){
        console.error(err);
    }

});

/* =========================
   SCREEN SHARE
========================= */

startScreenShareBtn.addEventListener("click", async () => {

    try{

        localStream =
            await navigator.mediaDevices.getDisplayMedia({
                video:true,
                audio:true
            });

        videoPlayer.srcObject = localStream;
        videoPlayer.muted = true;

        statusMessage.textContent =
            "Screen sharing started";

        localStream.getTracks().forEach(track => {

            track.onended = () => {
                socket.emit("stream-ended");
                cleanupStream();
            };

        });

    }catch(err){

        console.error(err);

        alert(
            "Screen sharing failed. Please allow permissions."
        );
    }

});

/* =========================
   WEBRTC
========================= */

async function createPeerConnection(){

    peerConnection =
        new RTCPeerConnection(rtcConfig);

    peerConnection.onicecandidate = event => {

        if(event.candidate){
            socket.emit(
                "ice-candidate",
                event.candidate
            );
        }
    };

    peerConnection.ontrack = event => {

        videoPlayer.srcObject = event.streams[0];

        subtitlesBox.style.display = "block";

        statusMessage.textContent =
            "Connected to live stream";

        startTranslation();

    };

    return peerConnection;
}

/* =========================
   STREAMER EVENTS
========================= */

socket.on("viewer-joined", async () => {

    if(userRole !== "streamer") return;
    if(!localStream) return;

    await createPeerConnection();

    localStream.getTracks().forEach(track => {
        peerConnection.addTrack(track, localStream);
    });

    const offer =
        await peerConnection.createOffer();

    await peerConnection.setLocalDescription(
        offer
    );

    socket.emit("offer", offer);

});

/* =========================
   VIEWER EVENTS
========================= */

socket.on("offer", async offer => {

    if(userRole !== "viewer") return;

    await createPeerConnection();

    await peerConnection.setRemoteDescription(
        new RTCSessionDescription(offer)
    );

    const answer =
        await peerConnection.createAnswer();

    await peerConnection.setLocalDescription(
        answer
    );

    socket.emit("answer", answer);

});

socket.on("answer", async answer => {

    if(userRole !== "streamer") return;

    if(peerConnection){

        await peerConnection.setRemoteDescription(
            new RTCSessionDescription(answer)
        );
    }

});

socket.on("ice-candidate", async candidate => {

    try{

        if(peerConnection){

            await peerConnection.addIceCandidate(
                new RTCIceCandidate(candidate)
            );
        }

    }catch(err){
        console.error(err);
    }

});

socket.on("stream-ended", () => {

    cleanupStream();

    statusMessage.textContent =
        "Stream has ended";

});

/* =========================
   CLEANUP
========================= */

function cleanupStream(){

    if(videoPlayer.srcObject){
        videoPlayer.srcObject = null;
    }

    subtitlesBox.style.display = "none";

    if(peerConnection){
        peerConnection.close();
        peerConnection = null;
    }

    if(recognition){

        recognition.onend = null;

        try{
            recognition.stop();
        }catch(e){}
    }
}

/* =========================
   TRANSLATION
========================= */

function startTranslation(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        subtitlesBox.textContent =
            "Speech recognition unsupported";

        return;
    }

    recognition = new SpeechRecognition();

    recognition.continuous = true;
    recognition.interimResults = false;

    recognition.lang = "th-TH";

    recognition.onresult = async event => {

        let transcript = "";

        for(let i = event.resultIndex;
            i < event.results.length;
            i++){

            transcript +=
                event.results[i][0].transcript;
        }

        if(transcript.trim()){

            subtitlesBox.textContent =
                "Translating...";

            const translated =
                await translateThaiToEnglish(
                    transcript
                );

            subtitlesBox.textContent =
                translated;
        }
    };

    recognition.onerror = err => {
        console.error(err);
    };

    recognition.onend = () => {

        if(videoPlayer.srcObject){
            recognition.start();
        }
    };

    recognition.start();
}

/* =========================
   GOOGLE TRANSLATE
========================= */

async function translateThaiToEnglish(text){

    try{

        const response = await fetch(
            `https://translate.googleapis.com/translate_a/single?client=gtx&sl=th&tl=en&dt=t&q=${encodeURIComponent(text)}`
        );

        const data = await response.json();

        return data[0]
            .map(item => item[0])
            .join("");

    }catch(err){

        console.error(err);

        return "[Translation Failed]";
    }
}

</script>

</body>
</html>
